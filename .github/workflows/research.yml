name: Validate forecasting and rolling research
on:
  pull_request:
  push:
    branches:
      - development/forecast-rolling-engine
  workflow_dispatch:
  schedule:
    - cron: '47 * * * *'
permissions:
  contents: read
concurrency:
  group: fpl-research-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline regression and point-in-time tests
        run: python -m unittest discover -s tests -v
      - name: Refresh public evidence
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python collector.py
          python summary.py
          python research_runner.py
      - uses: actions/upload-artifact@v4
        if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        with:
          name: public-research-status-${{ github.run_id }}
          path: data/latest-research-status.json
          retention-days: 30
          if-no-files-found: error
