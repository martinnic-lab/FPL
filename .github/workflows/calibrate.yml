name: Calibrate FPL forecasts
on:
  workflow_dispatch:
  schedule:
    - cron: '45 19 * * 2'
  push:
    paths:
      - calibration.py
      - tests/test_calibration.py
      - .github/workflows/calibrate.yml
permissions:
  contents: write
concurrency:
  group: fpl-calibration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run all unit tests
        run: python -m unittest discover -s tests -v
      - name: Walk-forward evaluation
        run: python calibration.py
      - name: Commit report
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/calibration-report.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: update FPL walk-forward calibration report'
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" push origin "HEAD:${GITHUB_REF_NAME}"
