name: Collect public FPL data
on:
  schedule:
    - cron: '17 0,8,16 * * *'
  workflow_dispatch:
  push:
    paths:
      - collector.py
      - engine.py
      - projection_inputs.py
      - chip_planner.py
      - leagues.py
      - cumbres.py
      - tests/**
      - .github/workflows/collect.yml
permissions:
  contents: write
concurrency:
  group: fpl-collector-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test collector
        run: python -m unittest discover -s tests -v
      - name: Collect and validate
        run: python collector.py
      - name: Build compact decision summary
        run: python summary.py
      - name: Generate independent baseline decision screen
        run: python engine.py
      - name: Collect public mini-league standings
        run: python leagues.py
      - name: Audit Cumbres public rival squads
        run: python cumbres.py
      - name: Commit snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/snapshots/*.json data/latest-summary.json data/latest-leagues.json data/latest-cumbres-rivals.json data/latest-engine.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: collect validated public FPL snapshot'
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" push origin "HEAD:${GITHUB_REF_NAME}"
